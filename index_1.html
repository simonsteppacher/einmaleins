<style>
/* Layout: Häuschenpapier wie die Trainer; eine Spalte mit grossen Kacheln, je eine pro Trainer. Neue Trainer: einen <a class="tile"> Block ergänzen. */
:root {
  --paper: #f8faf3;
  --grid: #d3e3ea;
  --ink: #1b3358;
  --ink-soft: #5a6d88;
  --surface: #ffffff;
  --edge: #b9cbd6;
  --font-display: "Baloo 2", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c3a33; --grid: #2a4b43; --ink: #f3f0e4; --ink-soft: #b3c4bb; --surface: #24463e; --edge: #3f655b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1c3a33; --grid: #2a4b43; --ink: #f3f0e4; --ink-soft: #b3c4bb; --surface: #24463e; --edge: #3f655b;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 16px;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: inherit; }
main { width: 100%; max-width: 440px; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 3rem; line-height: 1.05; margin: 0; text-wrap: balance; }
p { margin: 0; }
.soft { color: var(--ink-soft); }

.tiles { display: flex; flex-direction: column; gap: 14px; }
.tile {
  display: flex; align-items: center; gap: 16px;
  background: var(--surface); color: var(--ink); text-decoration: none;
  border: 3px solid var(--ink); border-radius: 18px; padding: 14px 16px;
}
.tile:active { transform: translateY(2px); }
.tile:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.tile img { width: 72px; height: 72px; border-radius: 16px; flex: none; }
.tile b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1.1; }
.tile span { display: block; color: var(--ink-soft); font-size: 0.95rem; }
.tile .arrow { margin-left: auto; font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; color: var(--ink-soft); }
.hint { font-size: 0.85rem; }
</style>
</head>
