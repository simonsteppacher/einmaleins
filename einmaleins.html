  --right: #1f8a4c;
  --right-bg: #dff3e6;
  --wrong: #c8372d;
  --wrong-bg: #fbe3e0;
  --font-display: "Baloo 2", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c3a33; --grid: #2a4b43; --ink: #f3f0e4; --ink-soft: #b3c4bb;
    --surface: #24463e; --edge: #3f655b; --key: #2a5047; --key-press: #37635a;
    --primary: #f3f0e4; --on-primary: #1c3a33;
    --right: #8fe0a8; --right-bg: #23543c; --wrong: #ffa69c; --wrong-bg: #5a3230;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1c3a33; --grid: #2a4b43; --ink: #f3f0e4; --ink-soft: #b3c4bb;
  --surface: #24463e; --edge: #3f655b; --key: #2a5047; --key-press: #37635a;
  --primary: #f3f0e4; --on-primary: #1c3a33;
  --right: #8fe0a8; --right-bg: #23543c; --wrong: #ffa69c; --wrong-bg: #5a3230;
  color-scheme: dark;
}

html { height: 100%; }
body {
  min-height: 100%;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 16px;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
*, *::before, *::after { box-sizing: inherit; }
main {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  margin-block: auto;
}
section { display: flex; flex-direction: column; gap: 20px; }

h1, h2 {
  font-family: var(--font-display);
  font-weight: 800;
  line-height: 1.05;
  margin: 0;
  text-wrap: balance;
}
h1 { font-size: 3rem; }
h2 { font-size: 2.2rem; }
p { margin: 0; }
.soft { color: var(--ink-soft); }
.back { font-weight: 700; color: var(--ink-soft); text-decoration: none; }
.back:hover { text-decoration: underline; }

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.primary {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.5rem;
  background: var(--primary);
  color: var(--on-primary);
  border: 0;
  border-radius: 16px;
  padding: 14px 20px;
  width: 100%;
}
.primary:disabled { opacity: 0.35; cursor: default; }
.primary:active:not(:disabled) { transform: translateY(2px); }

.ghost {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 1rem;
  background: transparent;
  color: var(--ink-soft);
  border: 2px solid var(--edge);
  border-radius: 12px;
  padding: 10px 14px;
  width: 100%;
}
.ghost:active { transform: translateY(1px); }

/* Startauswahl */
.modes { display: flex; flex-direction: column; gap: 12px; }
.mode {
  font-family: var(--font-display);
  font-weight: 800;
  text-align: center;
  background: var(--surface);
  color: var(--ink);
  border: 3px solid var(--primary);
  border-radius: 16px;
  padding: 18px 18px 16px;
  width: 100%;
}
.mode:active { transform: translateY(2px); }
.mode b { display: block; font-size: 1.6rem; line-height: 1.1; }

/* Start */
.sample {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.6rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.best {
  background: var(--surface);
  border: 2px dashed var(--edge);
  border-radius: 14px;
  padding: 10px 14px;
}

/* Quiz */
.progress { display: flex; flex-direction: column; gap: 8px; }
.dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.dot {
  height: 10px;
  border-radius: 5px;
  background: var(--surface);
  border: 2px solid var(--edge);
}
.dot.now { border-color: var(--ink); }
.dot.ok { background: var(--right); border-color: var(--right); }
.dot.no { background: var(--wrong); border-color: var(--wrong); }

.task {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.8rem, 15vw, 4rem);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.answer {
  min-width: 2.2em;
  padding: 6px 12px 0;
  text-align: center;
  background: var(--surface);
  border: 3px solid var(--ink);
  border-radius: 14px;
}
.answer.empty { color: var(--edge); }
.answer.ok { border-color: var(--right); background: var(--right-bg); color: var(--right); }
.answer.no { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); text-decoration: line-through; }

.feedback {
  min-height: 3.2em;
  text-align: center;
  font-weight: 700;
  font-size: 1.15rem;
}
.feedback.ok { color: var(--right); }
.feedback.no { color: var(--wrong); }
.feedback .solution {
  display: block;
  font-family: var(--font-display);
  font-size: 1.6rem;
  color: var(--ink);
}

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pad button {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.7rem;
  line-height: 1;
  padding: 12px 0 8px;
  background: var(--key);
  border: 2px solid var(--edge);
  border-bottom-width: 4px;
  border-radius: 12px;
}
.pad button:active:not(:disabled) { background: var(--key-press); transform: translateY(2px); border-bottom-width: 2px; }
.pad button:disabled { opacity: 0.4; cursor: default; }
.pad .zero { grid-column: 2; }

/* Reihe-nach-Modus */
.rowhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.rowhead .which { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
.rowhead .dir { font-weight: 700; color: var(--ink-soft); }
.seqline {
  background: var(--surface);
  border: 2px solid var(--edge);
  border-radius: 14px;
  padding: 12px 14px;
  min-height: 3em;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.5rem;
  font-variant-numeric: tabular-nums;
}
.seqline .num { color: var(--ink); }
.seqline .slot {
  min-width: 1.6em;
  text-align: center;
  color: var(--wrong);
  border-bottom: 4px solid var(--wrong);
  border-radius: 4px;
  padding: 0 6px;
}
.seqline .sep { color: var(--edge); font-weight: 600; }
.choices { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.choices button {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.35rem;
  line-height: 1;
  padding: 14px 0 11px;
  background: var(--key);
  border: 2px solid var(--edge);
  border-bottom-width: 4px;
  border-radius: 12px;
}
.choices button:active:not(:disabled) { background: var(--key-press); transform: translateY(2px); border-bottom-width: 2px; }
.choices button.no { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
.choices button.ok { background: var(--right-bg); border-color: var(--right); color: var(--right); }
.choices button:disabled { cursor: default; }

/* Ergebnis */
.verdict { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.verdict h2 { font-size: 1.8rem; }
.badge { font-size: 5.5rem; line-height: 1.1; }
.score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.score div {
  background: var(--surface);
  border: 2px solid var(--edge);
  border-radius: 14px;
  padding: 10px 6px 8px;
  text-align: center;
}
.score b {
  display: block;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.9rem;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.score span { font-size: 0.85rem; color: var(--ink-soft); }
.score .ok b { color: var(--right); }
.score .no b { color: var(--wrong); }

/* Stufen-Zähler (Feuerwerk, Krone, Daumen, Keimling) */
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.levels div {
  background: var(--surface);
  border: 2px solid var(--edge);
  border-radius: 14px;
  padding: 10px 4px 8px;
  text-align: center;
}
.levels .ico { display: block; font-size: 1.8rem; line-height: 1.2; }
.levels b {
  display: block;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.5rem;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.review {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
  font-variant-numeric: tabular-nums;
  font-size: 1rem;
}
.review li { padding: 4px 8px; border-radius: 8px; }
.review li.ok { color: var(--right); }
.review li.no { background: var(--wrong-bg); color: var(--wrong); }
.review s { opacity: 0.8; }
.review b { color: var(--ink); }

@media (max-width: 340px) { .review { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) {
  .answer.ok { animation: pop 0.25s ease-out; }
  .choices button.ok { animation: pop 0.25s ease-out; }
  @keyframes pop { 50% { transform: scale(1.12); } }
}
</style>
</head>
<body>

<main>
  <section id="start">
    <a class="back" href="index.html">← Johannas Lernseite</a>
    <h1>Johannas 1x1 Trainer</h1>
    <p class="sample" aria-hidden="true">7 · 8 = ?</p>
    <div class="modes">
      <button id="btn-seq" class="mode" type="button"><b>1x1 der Reihe nach</b></button>
      <button id="btn-random" class="mode" type="button"><b>Mal zufällig</b></button>
      <button id="btn-div" class="mode" type="button"><b>Geteilt zufällig</b></button>
    </div>
    <p id="best" class="best" hidden></p>
    <p id="best-div" class="best" hidden></p>
    <p id="total-start" class="soft" hidden></p>
    <div id="levels-start" class="levels" hidden></div>
  </section>

  <section id="quiz" hidden>
    <div class="progress">
      <p id="count" class="soft">Aufgabe 1 von 10</p>
      <div id="dots" class="dots" aria-hidden="true"></div>
    </div>
    <div class="task" aria-live="polite">
      <span id="q-left">1 · 1 =</span>
      <span id="answer" class="answer empty">?</span>
      <span id="q-right"></span>
    </div>
    <p id="feedback" class="feedback" aria-live="polite"></p>
    <div id="pad" class="pad">
      <button type="button" data-k="1">1</button>
      <button type="button" data-k="2">2</button>
      <button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button>
      <button type="button" data-k="5">5</button>
      <button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button>
      <button type="button" data-k="8">8</button>
      <button type="button" data-k="9">9</button>
      <button type="button" data-k="0" class="zero">0</button>
      <button type="button" data-k="del" aria-label="Letzte Ziffer löschen">⌫</button>
    </div>
    <button id="btn-go" class="primary" type="button" disabled>Prüfen</button>
  </section>

  <section id="seqquiz" hidden>
    <div class="progress">
      <div class="rowhead">
        <span class="which"><span id="seq-row">6er-Reihe</span></span>
        <span class="dir" id="seq-dir">aufwärts</span>
      </div>
      <p id="seq-count" class="soft">Zahl 1 von 9</p>
      <div id="seq-dots" class="dots" aria-hidden="true"></div>
    </div>
    <div id="seq-line" class="seqline" aria-live="polite"></div>
    <p id="seq-feedback" class="feedback" aria-live="polite"></p>
    <div id="choices" class="choices"></div>
    <button id="btn-seq-stop" class="ghost" type="button">Beenden</button>
  </section>

  <section id="result" hidden>
    <div class="verdict">
      <div id="badge" class="badge" aria-hidden="true" hidden></div>
      <h2 id="headline">Geschafft!</h2>
    </div>
    <div class="score">
      <div class="ok"><b id="n-right">0</b><span>richtig</span></div>
      <div class="no"><b id="n-wrong">0</b><span>falsch</span></div>
      <div><b id="n-time">0:00</b><span>Zeit</span></div>
    </div>
    <p id="record" class="soft"></p>
    <p id="total" class="soft"></p>
    <div id="levels-result" class="levels" hidden></div>
    <ul id="review" class="review"></ul>
    <button id="btn-again" class="primary" type="button">Noch einmal</button>
    <button id="btn-menu" class="ghost" type="button">Zur Auswahl</button>
  </section>

  <section id="seqresult" hidden>
    <div class="verdict">
      <div id="seq-badge" class="badge" aria-hidden="true" hidden></div>
      <h2 id="seq-headline">Geschafft!</h2>
    </div>
    <p id="seq-which" class="soft"></p>
    <div class="score">
      <div><b id="s-done">0</b><span>Zahlen</span></div>
      <div class="no"><b id="s-wrong">0</b><span>Fehler</span></div>
      <div><b id="s-time">0:00</b><span>Zeit</span></div>
    </div>
    <p id="seq-total" class="soft"></p>
    <div id="levels-seq" class="levels" hidden></div>
    <button id="btn-seq-again" class="primary" type="button">Neue Reihe</button>
    <button id="btn-seq-menu" class="ghost" type="button">Zur Auswahl</button>
  </section>
</main>

<script>
(function () {
  var TOTAL = 10;
  var ROWS_MAX = 10;   // Reihen 1..10
  var MULT_MAX = 10;   // jeweils bis ×10 (1er: 0..10, 6er: 0..60, 10er: 0..100)
  var FAST_MS = 70000; // unter 70 Sekunden = Champion (Feuerwerk)
  var $ = function (id) { return document.getElementById(id); };
  var screens = {
    start: $("start"), quiz: $("quiz"), seqquiz: $("seqquiz"),
    result: $("result"), seqresult: $("seqresult")
  };

  function show(name) {
    for (var k in screens) screens[k].hidden = (k !== name);
  }
  function fmtTime(ms) {
    var s = Math.round(ms / 1000);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  /* ---------------- Gespeicherte Werte (Bestleistung, Gesamtbilanz) ---------------- */
  // Bestleistung getrennt für Zufällig (Mal) und Geteilt
  function bestKey(m) { return m === "div" ? "einmaleins-best-div" : "einmaleins-best"; }
  function loadBest(m) {
    try {
      var b = JSON.parse(localStorage.getItem(bestKey(m)));
      if (b && typeof b.right === "number" && typeof b.ms === "number") return b;
    } catch (e) {}
    return null;
  }
  function saveBest(m, b) {
    try { localStorage.setItem(bestKey(m), JSON.stringify(b)); } catch (e) {}
  }
  function loadTotal() {
    try {
      var t = JSON.parse(localStorage.getItem("einmaleins-total"));
      if (t && typeof t.solved === "number" && typeof t.right === "number") return t;
    } catch (e) {}
    return { solved: 0, right: 0 };
  }
  function addTotal(ok) {
    var t = loadTotal();
    t.solved++;
    if (ok) t.right++;
    try { localStorage.setItem("einmaleins-total", JSON.stringify(t)); } catch (e) {}
  }
  function totalText() {
    var t = loadTotal();
    if (!t.solved) return "";
    return "Du hast schon " + t.solved + (t.solved === 1 ? " Rechnung" : " Rechnungen") + " gelöst, davon " + t.right + " richtig.";
  }
  function showBest() {
    var tt = totalText();
    $("total-start").textContent = tt;
    $("total-start").hidden = tt === "";
    renderLevels("levels-start");
    var b = loadBest("mult");
    $("best").hidden = !b;
    if (b) $("best").textContent = "Dein bestes Ergebnis (Mal): " + b.right + " von " + TOTAL + " richtig in " + fmtTime(b.ms) + " Minuten";
    var bd = loadBest("div");
    $("best-div").hidden = !bd;
    if (bd) $("best-div").textContent = "Dein bestes Ergebnis (Geteilt): " + bd.right + " von " + TOTAL + " richtig in " + fmtTime(bd.ms) + " Minuten";
  }

  /* Belohnung: gleiche Regel für beide Modi
     Stufe 1: 0 Fehler und unter 70 s  -> Feuerwerk  "Du bist ein Champion!"
     Stufe 2: 0 Fehler, 70 s oder mehr  -> Krone      "Tolle Leistung! Alles richtig! Noch ein bisschen schneller."
     Stufe 3: genau 1 Fehler             -> Daumen     "Übe fleissig weiter!"
     Stufe 4: 2+ Fehler                  -> Keimling   "Übung macht den Meister!" */
  function verdict(wrong, ms) {
    if (wrong === 0 && ms < FAST_MS) return { level: "fire",  badge: "", text: "Du bist ein Champion!", fireworks: true };
    if (wrong === 0) return { level: "crown", badge: "👑", text: "Tolle Leistung! Alles richtig! Noch ein bisschen schneller." };
    if (wrong === 1) return { level: "thumb", badge: "👍", text: "Übe fleissig weiter!" };
    return { level: "seed", badge: "🌱", text: "Übung macht den Meister!" };
  }

  /* Zähler je Stufe (wie oft Feuerwerk, Krone, Daumen, Keimling erreicht) */
  var LEVELS = [
    { key: "fire",  icon: "✨",         name: "Feuerwerk" },
    { key: "crown", icon: "👑",   name: "Krone" },
    { key: "thumb", icon: "👍",   name: "Daumen" },
    { key: "seed",  icon: "🌱",   name: "Keimling" }
  ];
  function loadLevels() {
    var l = { fire: 0, crown: 0, thumb: 0, seed: 0 };
    try {
      var s = JSON.parse(localStorage.getItem("einmaleins-levels"));
      if (s) for (var k in l) if (typeof s[k] === "number") l[k] = s[k];
    } catch (e) {}
    return l;
  }
  function addLevel(key) {
    var l = loadLevels();
    if (key in l) l[key]++;
    try { localStorage.setItem("einmaleins-levels", JSON.stringify(l)); } catch (e) {}
  }
  function renderLevels(id) {
    var l = loadLevels(), any = false, html = "";
    for (var i = 0; i < LEVELS.length; i++) {
      var lv = LEVELS[i];
      if (l[lv.key]) any = true;
      html += '<div title="' + lv.name + '"><span class="ico" aria-hidden="true">' + lv.icon + "</span><b>" + l[lv.key] + "</b></div>";
    }
    $(id).innerHTML = html;
    $(id).hidden = !any;
  }

  /* Kleines Feuerwerk (Canvas-Overlay, ca. 2.5 s, ohne externe Bibliothek) */
  function fireworks() {
    try {
      if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var c = document.createElement("canvas");
      c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999";
      document.body.appendChild(c);
      var ctx = c.getContext("2d");
      var dpr = window.devicePixelRatio || 1;
      function size() { c.width = window.innerWidth * dpr; c.height = window.innerHeight * dpr; }
      size();
      var parts = [], colors = ["#ffd166", "#ff5d8f", "#06d6a0", "#4cc9f0", "#ff9f1c", "#ffffff", "#c77dff"];
      function burst(x, y) {
        var col = colors[Math.floor(Math.random() * colors.length)];
        for (var i = 0; i < 90; i++) {
          var a = Math.random() * Math.PI * 2, s = (2.5 + Math.random() * 5.5) * dpr;
          parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1,
                       col: Math.random() < 0.7 ? col : "#ffffff", r: (2.5 + Math.random() * 3) * dpr });
        }
      }
      var t0 = Date.now(), n = 0;
      burst(0.5 * c.width, 0.25 * c.height);          // erste Salve sofort in der Mitte
      var timer = setInterval(function () {
        if (n++ < 8) burst((0.15 + Math.random() * 0.7) * c.width, (0.12 + Math.random() * 0.45) * c.height);
        else clearInterval(timer);
      }, 330);
      function frame() {
        ctx.clearRect(0, 0, c.width, c.height);
        for (var i = parts.length - 1; i >= 0; i--) {
          var p = parts[i];
          p.x += p.vx; p.y += p.vy; p.vy += 0.05 * dpr; p.vx *= 0.985; p.vy *= 0.985; p.life -= 0.013;
          if (p.life <= 0) { parts.splice(i, 1); continue; }
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.col;
          ctx.shadowBlur = 8 * dpr; ctx.shadowColor = p.col;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.6 + 0.4 * p.life), 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        if (Date.now() - t0 < 3600 || parts.length) requestAnimationFrame(frame);
        else if (c.parentNode) c.parentNode.removeChild(c);
      }
      requestAnimationFrame(frame);
    } catch (e) {}
  }

  /* ---------------- Zufällig (Mal) und Geteilt ---------------- */
  // mode "mult": Malaufgabe, Fragezeichen beim Produkt oder einem Faktor
  // mode "div":  Geteiltaufgabe  Produkt : b = a   (Produkte aus dem 1x1 bis 10x10, Teiler 1..10)
  var mode = "mult";
  var tasks = [], idx = 0, input = "", checked = false, taskStart = 0, elapsed = 0;

  function taskLine(t) {   // vollständige Rechnung als Text, z. B. "7 · 8 = 56" oder "56 : 8 = 7"
    var P = t.a * t.b;
    return mode === "div" ? P + " : " + t.b + " = " + t.a : t.a + " · " + t.b + " = " + P;
  }

  function newRound(m) {
    mode = m === "div" ? "div" : "mult";
    var all = [];
    for (var a = 1; a <= 10; a++) for (var b = 1; b <= 10; b++) all.push({ a: a, b: b });
    for (var i = all.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = all[i]; all[i] = all[j]; all[j] = t;
    }
    tasks = all.slice(0, TOTAL);
    // Mal: Fragezeichen zufällig beim Produkt (0), beim ersten (1) oder zweiten Faktor (2)
    // Geteilt: gesucht ist immer der Quotient (a)
    for (var k = 0; k < tasks.length; k++) tasks[k].miss = mode === "div" ? 0 : Math.floor(Math.random() * 3);
    idx = 0;
    elapsed = 0;
    var dots = "";
    for (var d = 0; d < TOTAL; d++) dots += '<span class="dot"></span>';
    $("dots").innerHTML = dots;
    show("quiz");
    showTask();
  }
  function setPad(enabled) {
    var keys = $("pad").querySelectorAll("button");
    for (var i = 0; i < keys.length; i++) keys[i].disabled = !enabled;
  }
  function renderInput() {
    var el = $("answer");
    el.className = "answer" + (input === "" ? " empty" : "");
    el.textContent = input === "" ? "?" : input;
    $("btn-go").disabled = input === "";
  }
  function showTask() {
    var t = tasks[idx];
    input = "";
    checked = false;
    $("count").textContent = "Aufgabe " + (idx + 1) + " von " + TOTAL;
    var P = t.a * t.b;
    if (mode === "div")    { $("q-left").textContent = P + " : " + t.b + " ="; $("q-right").textContent = ""; }
    else if (t.miss === 1) { $("q-left").textContent = "";              $("q-right").textContent = "· " + t.b + " = " + P; }
    else if (t.miss === 2) { $("q-left").textContent = t.a + " ·";      $("q-right").textContent = "= " + P; }
    else                   { $("q-left").textContent = t.a + " · " + t.b + " ="; $("q-right").textContent = ""; }
    $("feedback").className = "feedback";
    $("feedback").textContent = "";
    $("btn-go").textContent = "Prüfen";
    var dots = $("dots").children;
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("now", i === idx);
    setPad(true);
    renderInput();
    taskStart = Date.now();
  }
  function press(k) {
    if (checked) return;
    if (k === "del") input = input.slice(0, -1);
    else if (input.length < 3) input = (input === "0" ? "" : input) + k;
    renderInput();
  }
  function check() {
    if (input === "") return;
    var t = tasks[idx];
    elapsed += Date.now() - taskStart;
    t.given = parseInt(input, 10);
    t.expect = mode === "div" ? t.a : (t.miss === 1 ? t.a : (t.miss === 2 ? t.b : t.a * t.b));   // gesuchte Zahl
    t.ok = t.given === t.expect;
    checked = true;
    addTotal(t.ok);
    setPad(false);
    var line = taskLine(t);
    $("answer").className = "answer " + (t.ok ? "ok" : "no");
    var fb = $("feedback");
    fb.className = "feedback " + (t.ok ? "ok" : "no");
    fb.innerHTML = (t.ok ? "Richtig!" : "Das stimmt leider nicht.") + '<span class="solution">' + line + "</span>";
    var dot = $("dots").children[idx];
    dot.classList.remove("now");
    dot.classList.add(t.ok ? "ok" : "no");
    $("btn-go").textContent = idx === TOTAL - 1 ? "Zum Ergebnis" : "Weiter";
    $("btn-go").disabled = false;
  }
  function next() {
    if (idx < TOTAL - 1) { idx++; showTask(); }
    else finish();
  }
  function finish() {
    var right = 0;
    for (var i = 0; i < tasks.length; i++) if (tasks[i].ok) right++;
    var wrong = TOTAL - right;
    $("n-right").textContent = right;
    $("n-wrong").textContent = wrong;
    $("n-time").textContent = fmtTime(elapsed);
    var v = verdict(wrong, elapsed);
    addLevel(v.level);
    $("badge").textContent = v.badge;
    $("badge").hidden = v.badge === "";
    $("headline").textContent = v.text;
    $("total").textContent = totalText();
    renderLevels("levels-result");

    var best = loadBest(mode);
    var isRecord = !best || right > best.right || (right === best.right && elapsed < best.ms);
    if (isRecord) saveBest(mode, { right: right, ms: elapsed });
    $("record").textContent = isRecord && best
      ? "Das ist dein neues bestes Ergebnis!"
      : (!isRecord ? "Dein bestes Ergebnis bisher: " + best.right + " richtig in " + fmtTime(best.ms) + " Minuten" : "");

    var html = "";
    for (var j = 0; j < tasks.length; j++) {
      var t = tasks[j], P = t.a * t.b;
      if (t.ok) {
        html += '<li class="ok">✓ ' + taskLine(t) + "</li>";
      } else {
        var fix = "<s>" + t.given + "</s> <b>" + t.expect + "</b>";   // falsche Eingabe durchgestrichen, richtige Zahl fett
        var line = mode === "div" ? P + " : " + t.b + " = " + fix
                 : t.miss === 1 ? fix + " · " + t.b + " = " + P
                 : t.miss === 2 ? t.a + " · " + fix + " = " + P
                 : t.a + " · " + t.b + " = " + fix;
        html += '<li class="no">✗ ' + line + "</li>";
      }
    }
    $("review").innerHTML = html;
    show("result");
    $("btn-again").focus();
    if (v.fireworks) fireworks();
  }

  /* ---------------- Der Reihe nach ---------------- */
  // Pro Durchgang EINE Reihe: Reihe (1..10) und Richtung werden zufällig gewählt.
  var seq = [], seqShown = 0, seqN = 1, seqUp = true, seqSteps = 0;
  var seqErrors = 0, seqDone = 0, seqStart = 0, seqLocked = false, stepHadError = false;

  function startSeq() {
    seqN = 1 + Math.floor(Math.random() * ROWS_MAX);
    seqUp = Math.random() < 0.5;
    seqErrors = 0;
    seqDone = 0;
    seqStart = Date.now();
    show("seqquiz");
    loadSeqRow();
  }

  function loadSeqRow() {
    seq = [];
    var k;
    if (seqUp) {
      for (k = 0; k <= MULT_MAX; k++) seq.push(k * seqN);          // 0, n, ... 10n
      seqShown = 2;                                                // 0 und n sind vorgegeben
    } else {
      for (k = MULT_MAX; k >= 0; k--) seq.push(k * seqN);          // 10n, 9n, ... 0
      seqShown = 1;                                                // nur die oberste Zahl ist vorgegeben
    }
    seqSteps = seq.length - seqShown;                              // zu wählende Zahlen
    stepHadError = false;
    $("seq-row").textContent = seqN + "er-Reihe";
    $("seq-dir").textContent = seqUp ? "aufwärts ↑" : "rückwärts ↓";
    var dots = "";
    for (var d = 0; d < seqSteps; d++) dots += '<span class="dot"></span>';
    $("seq-dots").innerHTML = dots;
    updateSeqProgress();
    $("seq-feedback").className = "feedback";
    $("seq-feedback").textContent = "";
    seqLocked = false;
    renderSeq();
    renderChoices();
  }

  function updateSeqProgress() {
    var step = Math.min(seqDone + 1, seqSteps);
    $("seq-count").textContent = "Zahl " + step + " von " + seqSteps;
    var dots = $("seq-dots").children;
    for (var i = 0; i < dots.length; i++) {
      dots[i].classList.toggle("ok", i < seqDone);
      dots[i].classList.toggle("now", i === seqDone);
    }
  }

  function renderSeq() {
    var box = $("seq-line");
    var html = "";
    for (var i = 0; i < seqShown; i++) {
      if (i) html += '<span class="sep">·</span>';
      html += '<span class="num">' + seq[i] + "</span>";
    }
    if (seqShown < seq.length) {
      if (seqShown) html += '<span class="sep">·</span>';
      html += '<span class="slot">?</span>';
    }
    box.innerHTML = html;
  }

  function renderChoices() {
    var box = $("choices");
    box.innerHTML = "";
    if (seqShown >= seq.length) return;
    var correct = seq[seqShown];         // gesuchte Zahl
    // Fenster aus 10 aufeinanderfolgenden Zahlen, das die Lösung an zufälliger Stelle enthält
    // (nicht mehr fix "die 10 über/unter der letzten Zahl", damit "immer die kleinste/grösste" nichts bringt)
    var lo = Math.max(0, correct - Math.floor(Math.random() * 10));
    var nums = [];
    var i;
    for (i = 0; i < 10; i++) nums.push(lo + i);
    if (nums.indexOf(correct) < 0) nums[Math.floor(Math.random() * 10)] = correct;   // Sicherheitsnetz: Lösung immer dabei
    // zufällige Reihenfolge, damit die richtige Zahl nicht immer an derselben Stelle steht
    for (i = nums.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = nums[i]; nums[i] = nums[j]; nums[j] = tmp;
    }
    for (i = 0; i < nums.length; i++) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = nums[i];
      b.setAttribute("data-v", nums[i]);
      box.appendChild(b);
    }
  }

  function pickChoice(btn) {
    if (seqLocked) return;
    if (seqShown >= seq.length) return;
    var v = parseInt(btn.getAttribute("data-v"), 10);
    var correct = seq[seqShown];
    if (v === correct) {
      btn.classList.add("ok");
      addTotal(!stepHadError);          // zählt in der Gesamtbilanz mit
      stepHadError = false;
      seqShown++;
      seqDone++;
      $("seq-feedback").className = "feedback ok";
      $("seq-feedback").textContent = "Richtig!";
      seqLocked = true;
      renderSeq();
      window.setTimeout(advanceSeq, 450);
    } else {
      btn.classList.add("no");
      btn.disabled = true;
      seqErrors++;
      stepHadError = true;
      var fb = $("seq-feedback");
      fb.className = "feedback no";
      fb.innerHTML = "Das stimmt nicht – versuch es nochmal!" +
        '<span class="solution">' + seq[seqShown - 1] + (seqUp ? " + " : " − ") + seqN + " = ?</span>";
    }
  }

  function advanceSeq() {
    seqLocked = false;
    updateSeqProgress();
    if (seqShown >= seq.length) {
      finishSeq();                       // Reihe fertig -> Belohnung, Zeit und Fehler zeigen
    } else {
      $("seq-feedback").className = "feedback";
      $("seq-feedback").textContent = "";
      renderChoices();
    }
  }

  function finishSeq() {
    var ms = Date.now() - seqStart;
    var complete = seqDone >= seqSteps;
    $("seq-which").textContent = seqN + "er-Reihe " + (seqUp ? "aufwärts" : "rückwärts") +
      (complete ? " – bis " + (MULT_MAX * seqN) + " geschafft" : " – abgebrochen");
    $("s-done").textContent = seqDone + " / " + seqSteps;
    $("s-wrong").textContent = seqErrors;
    $("s-time").textContent = fmtTime(ms);
    var v = complete ? verdict(seqErrors, ms) : { badge: "", text: "Übung beendet." };
    if (complete) addLevel(v.level);          // abgebrochene Reihen zählen nicht
    $("seq-badge").textContent = v.badge;
    $("seq-badge").hidden = v.badge === "";
    $("seq-headline").textContent = v.text;
    $("seq-total").textContent = totalText();
    renderLevels("levels-seq");
    show("seqresult");
    $("btn-seq-again").focus();
    if (v.fireworks) fireworks();
  }

  /* ---------------- Steuerung ---------------- */
  function toMenu() { showBest(); show("start"); }

  $("btn-seq").addEventListener("click", startSeq);
  $("btn-random").addEventListener("click", function () { newRound("mult"); });
  $("btn-div").addEventListener("click", function () { newRound("div"); });
  $("btn-again").addEventListener("click", function () { newRound(mode); });   // gleicher Modus nochmal
  $("btn-menu").addEventListener("click", toMenu);
  $("btn-seq-again").addEventListener("click", startSeq);
  $("btn-seq-menu").addEventListener("click", toMenu);
  $("btn-seq-stop").addEventListener("click", finishSeq);

  $("btn-go").addEventListener("click", function () { if (checked) next(); else check(); });
  $("pad").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b && !b.disabled) press(b.getAttribute("data-k"));
  });
  $("choices").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b && !b.disabled) pickChoice(b);
  });
  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!screens.quiz.hidden) {
      if (e.key === "Enter") { e.preventDefault(); if (checked) next(); else check(); return; }
      if (e.key >= "0" && e.key <= "9" && e.key.length === 1) press(e.key);
      else if (e.key === "Backspace") { e.preventDefault(); press("del"); }
    } else if (!screens.result.hidden && e.key === "Enter") { e.preventDefault(); newRound(mode); }
    else if (!screens.seqresult.hidden && e.key === "Enter") { e.preventDefault(); startSeq(); }
  });

  showBest();
})();
</script>
</body>
</html>
